<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentences</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Tektur", sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            color: rgb(0, 0, 0);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .title{
            margin-bottom: 50px;
            font-size: 24px;
            animation: fadeInUp 0.5s ease-in-out forwards;
        }
        .back-button {
            display: flex;
            align-self: self-start;
            text-align: start;
            font-family: Tektur;
            padding: 10px 20px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            justify-content: flex-start;
            background: linear-gradient(45deg, #ff6b6b, #ffb84d);
            color: white;
            border-radius: 8px;
            transition: 0.3s;
            margin-top: 10px;
            margin-bottom: 70px;
            margin-left: 20px;
        }

        .back-button:hover {
            background: linear-gradient(45deg, #ff4b4b, #ffa500);
            transform: scale(1.05);
        }

        .question {
            margin-bottom: 15px;
            font-size: 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: row;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            margin-left: calc(50% - 400px);
            margin-right: calc(50% - 400px);
            animation: fadeInUp 0.5s ease-in-out forwards;
        }
        .refresh-button {
            font-family: Tektur;
            display: none;
            padding: 12px 20px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            background: linear-gradient(45deg, #069219, #2abd05);
            color: white;
            border-radius: 10px;
            transition: 0.3s;
        }
        .refresh-button:hover {
            background: linear-gradient(45deg, #066412, #27b803);
            transform: scale(1.05);
        }
        input {
            font-family: Tektur;
            padding: 7px;
            font-size: 16px;
            border-radius: 5px;
            outline: none;
            margin-left: 5px;
            text-align: center;
        }

        .correct {
            color: #4caf50;
            font-weight: bold;
            animation: correctAnim 0.5s ease;
        }

        .incorrect {
            color: #ff4b4b;
            font-weight: bold;
            animation: incorrectAnim 0.5s ease;
        }
        .form {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        @keyframes correctAnim {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes incorrectAnim {
            0% { transform: scale(1); }
            50% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <button onmouseover="playSound()" class="back-button" onclick="window.location.href='menu.html';">Back</button>
    <div id="form" class="form">
        <h2 class="title">Fill in the gaps with the correct verb form</h2>
        <div id="questions"></div>
    </div>
    <button id="refresh-button" class="refresh-button" onclick="loadQuestions()">Next</button>
    <audio id="start" src="sounds/Fill_ingap.mp3"></audio>
    <audio id="awesome" src="sounds/awesome.mp3"></audio>
    <audio id="good" src="sounds/good.mp3"></audio>
    <audio id="yaright" src="sounds/yaright.mp3"></audio>
    <audio id="correct" src="sounds/correct.mp3"></audio>
    <audio id="yanotright" src="sounds/yanotright.mp3"></audio>
    <audio id="tryagn" src="sounds/tryagn.mp3"></audio>
    <audio id="wrong" src="sounds/wrong.mp3"></audio>
    <audio id="hoverSound" src="sounds/btn_hover.mp3"></audio>
    <audio id="letbgn" src="sounds/letbeg.mp3"></audio>
    <audio id="letstart" src="sounds/letstart.mp3"></audio>
    <script>
        let count = 0;
        const questions = [
            { text: "She __ (<span class='verb'>to go</span>) to school every day.", answer: "goes" },
            { text: "Yesterday, he __ (<span class='verb'>to visit</span>) his grandmother.", answer: "visited" },
            { text: "Tomorrow, they __ (<span class='verb'>to travel</span>) to London.", answer: "will travel" },
            { text: "I __ (<span class='verb'>to eat</span>) breakfast at 7 AM every morning.", answer: "eat" },
            { text: "Last week, she __ (<span class='verb'>to buy</span>) a new dress.", answer: "bought" },
            { text: "He usually __ (<span class='verb'>to watch</span>) TV in the evening.", answer: "watches" },
            { text: "When I was a child, we __ (<span class='verb'>to live</span>) in a small village.", answer: "lived" },
            { text: "Next summer, we __ (<span class='verb'>to go</span>) on vacation to Spain.", answer: "will go" }, 
            { text: "He __ (<span class='verb'>to read</span>) a book every evening.", answer: "reads" },
            { text: "They __ (<span class='verb'>to play</span>) football last Sunday.", answer: "played" },
            { text: "She __ (<span class='verb'>to write</span>) an email tomorrow.", answer: "will write" },
            { text: "I __ (<span class='verb'>to drink</span>) coffee every morning.", answer: "drink" },
            { text: "We __ (<span class='verb'>to visit</span>) Paris two years ago.", answer: "visited" },
            { text: "He usually __ (<span class='verb'>to drive</span>) to work.", answer: "drives" },
            { text: "When I was young, I __ (<span class='verb'>to swim</span>) in the lake.", answer: "swam" },
            { text: "Next year, they __ (<span class='verb'>to move</span>) to a new house.", answer: "will move" },
            { text: "She __ (<span class='verb'>to call</span>) her friend yesterday.", answer: "called" },
            { text: "My brother __ (<span class='verb'>to watch</span>) TV every night.", answer: "watches" },
            { text: "Last summer, we __ (<span class='verb'>to travel</span>) to Italy.", answer: "traveled" },
            { text: "The sun __ (<span class='verb'>to rise</span>) in the east.", answer: "rises" },
            { text: "Yesterday, they __ (<span class='verb'>to forget</span>) their keys.", answer: "forgot" },
            { text: "I __ (<span class='verb'>to be</span>) very tired last night.", answer: "was" },
            { text: "In next week, we __ (<span class='verb'>to finish</span>) the project.", answer: "will finish" },
            { text: "He __ (<span class='verb'>to speak</span>) English fluently.", answer: "speaks" },
            { text: "She __ (<span class='verb'>to buy</span>) a new phone yesterday.", answer: "bought" },
            { text: "They __ (<span class='verb'>to arrive</span>) before noon tomorrow.", answer: "will arrive" }
        ];

        const sounds_y = [
            'awesome', 'good', 'yaright', 'correct'
        ]

        const sounds_n = [
            'wrong', 'tryagn', 'yanotright'
        ]

        const sounds_let = [
            'letbgn', 'letstart'
        ]
        
        async function start() {
            let text = document.getElementById("form");
            text.style.display = "flex";
            let audio1 = document.getElementById(sounds_let[Math.floor(Math.random()*sounds_let.length)]);
            let audio2 = document.getElementById('start');

            audio1.currentTime = 0;
            audio1.play();

            await new Promise(resolve => audio1.onended = resolve);
            audio2.currentTime = 0;
            audio2.play();
        };

        function loadQuestions() {
            let btn = document.getElementById('refresh-button')
            btn.style.display = "none"
            const container = document.getElementById("questions");
            container.innerHTML = "";

            let numQuestions = 3;
            let selectedQuestions = [];

            while (selectedQuestions.length < numQuestions) {
                let randomIndex = Math.floor(Math.random() * questions.length);
                if (!selectedQuestions.includes(randomIndex)) {
                    selectedQuestions.push(randomIndex);
                }
            }

            selectedQuestions.forEach((index, i) => {
            let q = questions[index];
            let div = document.createElement("div");
            div.className = "question";
            div.innerHTML = `
                ${i + 1}. ${q.text.replace("__", `<input type='text' id='q${i}' onkeypress='handleKeyPress(event, ${i}, ${index})' autocomplete='off'>`)}
                <span id='result${i}'></span>
            `;
            container.appendChild(div);
            });
        }


        function handleKeyPress(event, index, questionIndex) {
            if (event.key === "Enter") {
                checkAnswer(index, questionIndex);
            }
        }

        function checkAnswer(index, questionIndex) {
            let input = document.getElementById(`q${index}`);
            let resultSpan = document.getElementById(`result${index}`);
            let questionDiv = document.querySelectorAll(".question")[index];
            let correctAnswer = questions[questionIndex].answer;

            if (input.value.trim().toLowerCase() === correctAnswer) {
                count += 1;
                resultSpan.textContent = ' ' + "✓ Correct!";
                resultSpan.className = "correct";

                let audio = document.getElementById(sounds_y[Math.floor(Math.random()*sounds_y.length)]);
                audio.currentTime = 0;
                audio.play();

                let textNode = document.createTextNode(` ${correctAnswer}`);
                questionDiv.replaceChild(textNode, input);

                let verbSpan = questionDiv.querySelector(".verb");
                if (verbSpan) {
                    verbSpan.outerHTML = ' ';
                }
                

                questionDiv.innerHTML = questionDiv.innerHTML.replace(/\(\s*([a-zA-Z\s]+)\s*\)/g, '$1');
            } else {
                count += 1;
                resultSpan.textContent = ' ' + `✗ Correct answer: ${correctAnswer}`;
                resultSpan.className = "incorrect";

                let audio = document.getElementById(sounds_n[Math.floor(Math.random()*sounds_n.length)]);
                audio.currentTime = 0;
                audio.play();

                let textNode = document.createTextNode(` ${correctAnswer}`);
                questionDiv.replaceChild(textNode, input);

                let verbSpan = questionDiv.querySelector(".verb");
                if (verbSpan) {
                    verbSpan.outerHTML = ' ';
                }

                questionDiv.innerHTML = questionDiv.innerHTML.replace(/\(\s*([a-zA-Z\s]+)\s*\)/g, '$1');
            }
            if (count === 3){
                let btn = document.getElementById('refresh-button')
                btn.style.display = "block"
                count = 0;
            }
        }

        window.onload = loadQuestions;
        function playSound() {
            let audio = document.getElementById("hoverSound");
            audio.currentTime = 0;
            audio.play();
        }

        start();
    </script>
</body>
</html>
