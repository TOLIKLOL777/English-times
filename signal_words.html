<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Words</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tektur', sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px;
        }
        .column {
            width: 300px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        .dropzone {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            min-height: 100px;
            padding: 10px;
            border: 2px dashed #ccc;
            margin-top: 10px;
            border-radius: 5px;
        }
        .word-container {
            margin-top: 20px;
        }
        .word {
            height: 20px;
            display: inline-block;
            padding: 8px 12px;
            margin: 5px;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: grab;
            transition: transform 0.2s, opacity 0.5s;
        }
        .word:active {
            cursor: grabbing;
            transform: scale(1.1);
        }
        .correct {
            background: #28a745 !important;
            animation: correctAnim 0.5s ease-in-out;
        }
        .incorrect {
            background: #dc3545 !important;
            animation: shake 0.3s;
        }
        .button {
            font-family: Tektur;
            padding: 10px 20px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            color: white;
            border-radius: 8px;
            transition: 0.3s;
            margin-top: 10px;
            margin-bottom: 70px;
            margin-left: 20px;
        }
        .back-button {
            display: flex;
            text-align: start;
            font-family: Tektur;
            background: linear-gradient(45deg, #ff6b6b, #ffb84d);
        }
        .back-button:hover {
            background: linear-gradient(45deg, #ff4b4b, #ffa500);
            transform: scale(1.05);
        }
        .reset-button {
            background: linear-gradient(45deg, #4CAF50, #2E8B57);
        }
        .reset-button:hover {
            background: linear-gradient(45deg, #45a049, #1e6a43);
            transform: scale(1.05);
        }
        .reset-button-container {
            display: none;
            justify-content: center;
        }
        .form {
            display: none;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: fadeInUp 0.5s ease-in-out forwards;
        }
        .fade-in {
            opacity: 1;
            transform: translateY(0);
        }
        .start_btn {
            font-family: Tektur;
            position: relative;
            width: 100px;
            padding: 12px 24px;
            margin-top: 100px;
            font-size: 24px;
            font-weight: bold;
            color: rgb(0, 0, 0);
            background: linear-gradient(45deg, #069219, #2abd05);
            border: none;
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
            transition: 0.3s ease-in-out;
            transition: transform 0.3s, background 0.3s;
        }  

        .start_btn:hover {
            background: linear-gradient(45deg, #066412, #27b803);
            transform: scale(1.1);
        }
        @keyframes correctAnim {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <button onmouseover="playSound()" class="back-button button" onclick="window.location.href='menu.html';">Back</button>
    <button id="start_btn" class="start_btn">Play</button>
    <div id="form" class="form">
        <h1>Move words to the correct columns</h1>
        <div class="container">
            <div class="column" id="present" ondragover="allowDrop(event)" ondrop="drop(event, 'present')">
                <strong>Present Simple</strong>
                <div class="dropzone"></div>
            </div>
            <div class="column" id="past" ondragover="allowDrop(event)" ondrop="drop(event, 'past')">
                <strong>Past Simple</strong>
                <div class="dropzone"></div>
            </div>
            <div class="column" id="future" ondragover="allowDrop(event)" ondrop="drop(event, 'future')">
                <strong>Future Simple</strong>
                <div class="dropzone"></div>
            </div>
        </div>
        <div class="word-container" id="word-bank"></div>
        <div id="reset-button-container" class="reset-button-container">
            <button id="refresh-button" class="reset-button button" onclick="resetGame()">Next</button>
        </div>
    </div>
    <audio id="start" src="sounds/Move_words.mp3"></audio>
    <audio id="awesome" src="sounds/awesome.mp3"></audio>
    <audio id="good" src="sounds/good.mp3"></audio>
    <audio id="yaright" src="sounds/yaright.mp3"></audio>
    <audio id="correct" src="sounds/correct.mp3"></audio>
    <audio id="yanotright" src="sounds/yanotright.mp3"></audio>
    <audio id="tryagn" src="sounds/tryagn.mp3"></audio>
    <audio id="wrong" src="sounds/wrong.mp3"></audio>
    <audio id="hoverSound" src="sounds/btn_hover.mp3"></audio>
    <audio id="letbgn" src="sounds/letbeg.mp3"></audio>
    <audio id="letstart" src="sounds/letstart.mp3"></audio>
    <script>
        let count = 0;
        const words = [
            { text: "always", tense: "present" },
            { text: "every day", tense: "present" },
            { text: "every week", tense: "present" },
            { text: "every month", tense: "present" },
            { text: "every year", tense: "present" },
            { text: "never", tense: "present" },
            { text: "regularly", tense: "present" },
            { text: "often", tense: "present" },
            { text: "usually", tense: "present" },
            { text: "yesterday", tense: "past" },
            { text: "last week", tense: "past" },
            { text: "last month", tense: "past" },
            { text: "last year", tense: "past" },
            { text: "last week", tense: "past" },
            { text: "ago", tense: "past" },
            { text: "tomorrow", tense: "future" },
            { text: "next week", tense: "future" },
            { text: "next month", tense: "future" },
            { text: "next year", tense: "future" },
            { text: "in a day", tense: "future" },
            { text: "in two week", tense: "future" },
            { text: "in 2025", tense: "future" }
        ];

        const sounds_y = [
            'awesome', 'good', 'yaright', 'correct'
        ]

        const sounds_n = [
            'wrong', 'tryagn', 'yanotright'
        ]

        const sounds_let = [
            'letbgn', 'letstart'
        ]

        document.getElementById("start_btn").addEventListener("click", async function() {
            let text = document.getElementById("form");
            text.style.display = "flex";
            document.getElementById("start_btn").style.display = 'none';
            let audio1 = document.getElementById(sounds_let[Math.floor(Math.random()*sounds_let.length)]);
            let audio2 = document.getElementById('start');

            audio1.currentTime = 0;
            audio1.play();

            await new Promise(resolve => audio1.onended = resolve);
            audio2.currentTime = 0;
            audio2.play();
            createWords();      
        });

        function getRandomWords(count) {
            let shuffled = words.sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function createWords() {
            let btn = document.getElementById('refresh-button')
            btn.style.display = "none"
            const wordBank = document.getElementById("word-bank");
            wordBank.innerHTML = "";
            let selectedWords = getRandomWords(6);
            selectedWords.forEach((word, index) => {
                const wordElement = document.createElement("div");
                wordElement.classList.add("word");
                wordElement.draggable = true;
                wordElement.ondragstart = drag;
                wordElement.id = `word-${index}`;
                wordElement.dataset.tense = word.tense;
                wordElement.textContent = word.text;
                wordElement.style.opacity = "0";
                wordBank.appendChild(wordElement);
                setTimeout(() => wordElement.style.opacity = "1", 200 * index);
            });
        }

        function allowDrop(event) {
            event.preventDefault();
        }

        function drag(event) {
            if (!event.target.classList.contains("correct")) {
                event.dataTransfer.setData("text", event.target.id);
            }
        }

        function drop(event, tense) {
            event.preventDefault();
            var data = event.dataTransfer.getData("text");
            var wordElement = document.getElementById(data);
            var dropzone = event.target.closest(".column").querySelector(".dropzone");

            if (wordElement && !wordElement.classList.contains("correct")) {
                if (wordElement.dataset.tense === tense) {
                    wordElement.classList.add("correct");
                    dropzone.appendChild(wordElement);
                    count += 1;
                    let audio = document.getElementById(sounds_y[Math.floor(Math.random()*sounds_y.length)]);
                    audio.currentTime = 0;
                    audio.play();
                } else {
                    wordElement.classList.add("incorrect");
                    let audio = document.getElementById(sounds_n[Math.floor(Math.random()*sounds_n.length)]);
                    audio.currentTime = 0;
                    audio.play();
                    setTimeout(() => {
                        document.getElementById("word-bank").appendChild(wordElement);
                        wordElement.classList.remove("incorrect");
                    }, 1000);
                }
            }
            if (count === 6){
                let btn = document.getElementById('reset-button-container');
                btn.style.display = "flex";
                document.getElementById('refresh-button').style.display = 'block';
                count = 0;
            }
        }

        function resetGame() {
            document.querySelectorAll(".dropzone").forEach(zone => zone.innerHTML = "");
            createWords();
        }

        function playSound() {
            let audio = document.getElementById("hoverSound");
            audio.currentTime = 0;
            audio.play();
        }
    </script>
</body>
</html>
