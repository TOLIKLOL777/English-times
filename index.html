<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English_times</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index_style.css">
</head>
<body>
    <h1 id="title" class="title">Welcome to English trainer of simple tenses</h1>
    <div id="start" class="start_menu">
        <button id="start_btn" class="start_btn" onclick="playWelcome();">Start</button>
    </div>
    <ul id="menu" class="list">
        <h2 id="title2" class="title">Choose what you want to do</h2>
        <section id="section" class="section">
            <button onmouseover="playMGS()" class="button" onclick="window.location.href='main.html';">Main game</button>
            <button onmouseover="playTrainer()" class="button" onclick="window.location.href='menu.html';">Trainer</button>   
        </section>
        <footer class="footer">
            <div class="line"></div>
            <p class="footer_text">Voiced by - Alexander Nikolaev</p>
        </footer>
    </ul>
    <audio id="mgs" src="sounds/main_game.mp3"></audio>
    <audio id="trainer" src="sounds/trainer.mp3"></audio>
    <audio id="welcome" src="sounds/welcome_2.mp3"></audio>
    <audio id="choose" src="sounds/Choose_todo.mp3"></audio>
    <script>
        document.getElementById("start_btn").addEventListener("click", function() {
            let text = document.getElementById("title");
            text.classList.toggle("show");
        });

        async function playWelcome() {
            let audio1 = document.getElementById("welcome");
            let audio2 = document.getElementById("choose");
            let start = document.getElementById("start");
            start.style.display = "none";
            let menu = document.getElementById("menu");
            menu.style.display = "flex";

            audio1.currentTime = 0;
            audio1.play();

            await new Promise(resolve => audio1.onended = resolve);
            let text = document.getElementById("title2");
            text.classList.toggle("show");
            document.getElementById("section").classList.toggle("show");
            audio2.currentTime = 0;
            audio2.play();
        }

        function playMGS() {
            let audio = document.getElementById("mgs");
            audio.currentTime = 0;
            audio.play();
        }

        function playTrainer() {
            let audio = document.getElementById("trainer");
            audio.currentTime = 0;
            audio.play();
        }
    </script>
</body>
</html>
