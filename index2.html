<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English_times</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap" rel="stylesheet">
    <style>
            * {
        margin: 0;
        padding: 0;
        }

        body{
            font-family: "Tektur", sans-serif;
            background: linear-gradient(-45deg, #ffcc00, #ff6b6b, #8a2be2, #ffcc00);
            background-size: 400% 400%;
            animation: gradientAnimation 10s ease infinite;
            background-attachment: fixed;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        .title{
            margin-top: 70px;
            font-family: Tektur;
            padding-left: calc(50% - 600px);
            padding-right: calc(50% - 600px);
            display: flex;
            justify-content: center;
            padding-top: 50px;
            padding-bottom: 50px;
            transition: opacity 0.5s ease, max-height 0.5s ease;
        }
        h1 {
            font-size: 2.5em;
            font-family: Tektur, cursive;
            color: #000000;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.90); }
            50% { transform: scale(1); }
            100% { transform: scale(0.90); }
        }

        .start_menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            list-style-type: none;
            flex-direction: column;
            align-items: center;
        }

        .start_btn {
            font-family: Tektur;
            position: relative;
            width: 300px;
            height: 200px;
            margin-top: 100px;
            font-size: 70px;
            font-weight: bold;
            color: rgb(0, 0, 0);
            background: linear-gradient(45deg, #069219, #2abd05);
            border: none;
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
            transition: 0.3s ease-in-out;
            transition: transform 0.3s, background 0.3s;
        }   

        .start_btn:hover {
            background: linear-gradient(45deg, #066412, #27b803);
            transform: scale(1.1);
        }

        .start_btn:active {
            transform: scale(0.95);
        }

        .list{
            display: flex;
            justify-content: center;
            gap: 20px;
            list-style-type: none;
            flex-direction: column;
            align-items: center;
            transition: opacity 1s ease-in;
        }

        .section {
            display: flex;
        }

        .footer {
            display: flex;
            flex-direction: column;
            position: absolute;
            width: 100%;
            bottom: 10px;
        }

        .footer_text {
            padding-left: 10px;
            padding-top: 10px;
        }

        .line{
            border: 0.5px solid rgb(0, 0, 0);
        }

        .button {
            font-family: Tektur;
            position: relative;
            width: 250px;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            color: rgb(0, 0, 0);
            background: linear-gradient(252.01deg, #FFCC00 0%, #eb8a1b 100%);
            border: none;
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
            transition: 0.3s ease-in-out;
            transition: transform 0.3s, background 0.3s;
        }   

        .button:hover {
            background: linear-gradient(252.01deg, #E8BA04 0%, #bb7c35 100%);
            transform: scale(1.1);
        }

        .button:active {
            transform: scale(0.95);
        }

        .info {
            margin-left: 15px;
            width: 20px;
            height: 20px;
            background-color: lightblue;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            cursor: default;
            position: relative;
        }

        .tooltip {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: black;
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 14px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .info:hover .tooltip {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
    <h1 id="title" class="title">English trainer of simple times</h1>
    <ul id="menu" class="list">
        <h2 id="title2" class="title">Choose what you want to do</h2>
        <section class="section">
            <button onmouseover="playMGS()" class="button" onclick="window.location.href='main.html';">Main game</button>
        </section>
        <section class="section">
            <button onmouseover="playTrainer()" class="button" onclick="window.location.href='menu.html';">Trainer</button>   
        </section>
        <footer class="footer">
            <div class="line"></div>
            <p class="footer_text">Voiced by - Alexander Nikolaev</p>
        </footer>
    </ul>
    <audio id="mgs" src="sounds/main_game.mp3"></audio>
    <audio id="trainer" src="sounds/trainer.mp3"></audio>
    <script>
        function playMGS() {
            let audio = document.getElementById("mgs");
            audio.currentTime = 0;
            audio.play();
        }

        function playTrainer() {
            let audio = document.getElementById("trainer");
            audio.currentTime = 0;
            audio.play();
        }
    </script>
</body>
</html>
