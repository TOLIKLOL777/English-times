<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уровень 7</title>
    <link rel="stylesheet" href="levels_style.css">
</head>
<body>
    <button class="back-button" onclick="window.location.href='../main.html';">Back</button>
    <h1>Уровень 7</h1>
    <div class="question-container">
        <div id="question-number" class="question-number"></div>
        <div id="question" class="question"></div>
        <div id="options" class="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-btn" class="next" onclick="nextQuestion()" style="display: none;">Следующий вопрос</button>
    </div>
    <div id="result-container" class="result_container">
        <h2 id="result-text"></h2>
        <button onclick="restartQuiz()" class="retry">Попробовать снова</button>
        <button onclick="goToMenu()" class="menu-btn" style="display: none;">Вернуться в меню</button>
    </div>
    <script>
        const questions = [
            { q: "Yesterday, he ___ (to visit) his grandmother.", options: ["visit", "visited", "will visit"], correct: "visited" },
            { q: "Last week, she ___ (to buy) a new dress.", options: ["buys", "bought", "will buy"], correct: "bought" },
            { q: "They ___ (to play) football last Sunday.", options: ["play", "played", "will play"], correct: "played" },
            { q: "Yesterday, they ___ (to forget) their keys.", options: ["forget", "forgot", "forgets"], correct: "forgot" },
            { q: "Last summer, we ___ (to travel) to Italy.", options: ["travel", "traveled", "will travel"], correct: "traveled" }
        ];

        
        let currentQuestion = 0;
        let correctAnswers = 0;

        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function loadQuestion() {
            document.getElementById("question-number").innerText = `Вопрос ${currentQuestion + 1} из ${questions.length}`;
            document.getElementById("question").innerText = questions[currentQuestion].q;
            document.getElementById("options").innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-btn").style.display = "none";
            
            let shuffledOptions = shuffleArray([...questions[currentQuestion].options]);
            shuffledOptions.forEach(option => {
                let btn = document.createElement("button");
                btn.innerText = option;
                btn.onclick = () => checkAnswer(btn, option);
                document.getElementById("options").appendChild(btn);
            });
        }
        
        function checkAnswer(button, answer) {
            let buttons = document.querySelectorAll(".options button");
            buttons.forEach(btn => btn.disabled = true);
            
            if (answer === questions[currentQuestion].correct) {
                button.style.backgroundColor = "#4CAF50";
                document.getElementById("feedback").innerText = "✅ Правильно!";
                correctAnswers++;
            } else {
                button.style.backgroundColor = "#E53935";
                document.getElementById("feedback").innerText = `❌ Неправильно. Верный ответ: ${questions[currentQuestion].correct}`;
            }
            
            document.getElementById("next-btn").style.display = "block";
        }
        
        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                if (correctAnswers === questions.length){
                    let completedLevels = JSON.parse(localStorage.getItem("completedLevels")) || [];
                    if (!completedLevels.includes(7)) {
                        completedLevels.push(7);
                        localStorage.setItem("completedLevels", JSON.stringify(completedLevels));
                    }
                }
                showResults();
            }
        }
        
        function showResults() {
            document.querySelector(".question-container").style.display = "none";
            document.getElementById("result-container").style.display = "flex";
            
            document.getElementById("result-text").innerText = `Вы ответили правильно на ${correctAnswers} из ${questions.length} вопросов.`;
            
            if (correctAnswers < questions.length) {
                document.querySelector(".retry").style.display = "block";
            } 
            document.querySelector(".menu-btn").style.display = "block";
        }
        
        function restartQuiz() {
            currentQuestion = 0;
            correctAnswers = 0;
            document.querySelector(".question-container").style.display = "inline-block";
            document.getElementById("result-container").style.display = "none";
            document.querySelector(".menu-btn").style.display = "none";
            loadQuestion();
        }

        function goToMenu() {
            window.location.href = "../main.html";
        }
        
        document.addEventListener("DOMContentLoaded", loadQuestion);
    </script>
</body>
</html>
