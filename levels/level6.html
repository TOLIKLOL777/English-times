<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 6</title>
    <link rel="stylesheet" href="levels_style.css">
</head>
<body>
    <button onmouseover="playSound()" class="back-button" onclick="window.location.href='../main.html';">Back</button>    
    <h1>Level 6</h1>
    <div id="question-container" class="question-container">
        <div id="question-number" class="question-number"></div>
        <div id="question" class="question"></div>
        <div id="options" class="options"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-btn" class="next" onclick="nextQuestion()" style="display: none;">Next question</button>
    </div>
    <div id="result-container" class="result_container">
        <h2 id="result-text"></h2>
        <button onclick="restartQuiz()" class="retry" style="display: none;">Try again</button>
        <button onclick="goToMenu()" class="menu-btn" style="display: none;">Return to menu</button>
    </div>
    <audio id="hoverSound" src="../sounds/btn_hover.mp3"></audio>
    <audio id="awesome" src="../sounds/awesome.mp3"></audio>
    <audio id="good" src="../sounds/good.mp3"></audio>
    <audio id="yaright" src="../sounds/yaright.mp3"></audio>
    <audio id="correct" src="../sounds/correct.mp3"></audio>
    <audio id="yanotright" src="../sounds/yanotright.mp3"></audio>
    <audio id="tryagn" src="../sounds/tryagn.mp3"></audio>
    <audio id="wrong" src="../sounds/wrong.mp3"></audio>
    <audio id="hoverSound" src="../sounds/btn_hover.mp3"></audio>
    <audio id="letbgn" src="../sounds/letbeg.mp3"></audio>
    <audio id="letstart" src="../sounds/letstart.mp3"></audio>
    <script>
        const questions = [
            { q: "Какое это предложение 'Clara had a car accident when she was ten years old'", options: ["present simple", "past simple", "future simple"], correct: "past simple" },
            { q: "Какое это предложение 'It was very cold yesterday'", options: ["present simple", "past simple", "future simple"], correct: "past simple" },
            { q: "Какое это предложение 'Tom calls his friend every day'", options: ["present simple", "past simple", "future simple"], correct: "present simple" },
            { q: "Какое это предложение 'Mary made a cake two hours ago'", options: ["present simple", "past simple", "future simple"], correct: "past simple" },
            { q: "Какое это предложение 'They will be home tomorrow'", options: ["present simple", "past simple", "future simple"], correct: "future simple" }
        ];
        
        let currentQuestion = 0;
        let correctAnswers = 0;

        const sounds_y = [
            'awesome', 'good', 'yaright', 'correct'
        ]

        const sounds_n = [
            'wrong', 'tryagn', 'yanotright'
        ]

        const sounds_let = [
            'letbgn', 'letstart'
        ]

        function start() {
            let text = document.getElementById("question-container");
            text.style.display = "inline-block";
            document.getElementById("start_btn").style.display = 'none';
            let audio = document.getElementById(sounds_let[Math.floor(Math.random()*sounds_let.length)]);
            audio.currentTime = 0;
            audio.play();
            loadQuestion();
        };

        function shuffleArray(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function loadQuestion() {
            document.getElementById("question-number").innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
            document.getElementById("question").innerText = questions[currentQuestion].q;
            document.getElementById("options").innerHTML = "";
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-btn").style.display = "none";
            
            let shuffledOptions = shuffleArray([...questions[currentQuestion].options]);
            shuffledOptions.forEach(option => {
                let btn = document.createElement("button");
                btn.innerText = option;
                btn.onclick = () => checkAnswer(btn, option);
                document.getElementById("options").appendChild(btn);
            });
        }
        
        function checkAnswer(button, answer) {
            let buttons = document.querySelectorAll(".options button");
            buttons.forEach(btn => btn.disabled = true);
            
            if (answer === questions[currentQuestion].correct) {
                button.style.backgroundColor = "#4CAF50";
                document.getElementById("feedback").innerText = "✅ Correct!";
                correctAnswers++;
                let audio = document.getElementById(sounds_y[Math.floor(Math.random()*sounds_y.length)]);
                audio.currentTime = 0;
                audio.play();
            } else {
                button.style.backgroundColor = "#E53935";
                document.getElementById("feedback").innerText = `❌ Uncorrect. Correct answer is: ${questions[currentQuestion].correct}`;
                let audio = document.getElementById(sounds_n[Math.floor(Math.random()*sounds_n.length)]);
                audio.currentTime = 0;
                audio.play();
            }
            
            document.getElementById("next-btn").style.display = "block";
        }
        
        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                if (correctAnswers === questions.length){
                    let completedLevels = JSON.parse(localStorage.getItem("completedLevels")) || [];
                    if (!completedLevels.includes(6)) {
                        completedLevels.push(6);
                        localStorage.setItem("completedLevels", JSON.stringify(completedLevels));
                    }
                }
                showResults();
            }
        }
        
        function showResults() {
            document.querySelector(".question-container").style.display = "none";
            document.getElementById("result-container").style.display = "flex";
            
            document.getElementById("result-text").innerText = `You answered correctly on ${correctAnswers} of ${questions.length} questions.`;
            
            if (correctAnswers < questions.length) {
                document.querySelector(".retry").style.display = "block";
            } 
            document.querySelector(".menu-btn").style.display = "block";
        }
        
        function restartQuiz() {
            currentQuestion = 0;
            correctAnswers = 0;
            document.querySelector(".question-container").style.display = "inline-block";
            document.getElementById("result-container").style.display = "none";
            document.querySelector(".menu-btn").style.display = "none";
            document.querySelector(".retry").style.display = "none";
            loadQuestion();
        }

        function goToMenu() {
            window.location.href = "../main.html";
        }
        
        document.addEventListener("DOMContentLoaded", loadQuestion);

        function playSound() {
            let audio = document.getElementById("hoverSound");
            audio.currentTime = 0;
            audio.play();
        }
        start();
    </script>
</body>
</html>
