<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Tektur", sans-serif;
            text-align: center;
            padding: 20px;
        }
        .word {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }
        .option-button {
            font-family: Tektur;
            padding: 10px 20px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            transition: background 0.3s;
        }
        .correct {
            background-color: rgb(108, 248, 108);
        }
        .wrong {
            background-color: rgb(255, 108, 108);
        }
        .result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }
        .next {
            display: none;
            padding: 10px 15px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Тренировка глаголов в разных формах</h1>
    <p>Выберите время, к которому относится глагол:</p>
    <div class="word" id="word">...</div>
    <div>
        <button class="option-button" onclick="checkAnswer('present', this)">Present Simple</button>
        <button class="option-button" onclick="checkAnswer('past', this)">Past Simple</button>
        <button class="option-button" onclick="checkAnswer('future', this)">Future Simple</button>
    </div>
    <p id="result" class="result"></p>
    <button class="next" id="next" onclick="nextWord()">Следующее слово</button>

    <script>
        const words = [
            { word: "go", tense: "present" },
            { word: "went", tense: "past" },
            { word: "will go", tense: "future" },
            { word: "eat", tense: "present" },
            { word: "ate", tense: "past" },
            { word: "will eat", tense: "future" },
            { word: "see", tense: "present" },
            { word: "saw", tense: "past" },
            { word: "will see", tense: "future" }
        ];

        let currentWord = {};

        function nextWord() {
            currentWord = words[Math.floor(Math.random() * words.length)];
            document.getElementById("word").textContent = currentWord.word;
            document.getElementById("result").textContent = "";
            document.getElementById("next").style.display = "none";

            // Активируем кнопки и сбрасываем их цвет
            document.querySelectorAll(".option-button").forEach(button => {
                button.disabled = false;
                button.classList.remove("correct", "wrong");
            });
        }

        function checkAnswer(selectedTense, button) {
            const result = document.getElementById("result");
            const allButtons = document.querySelectorAll(".option-button");

            // Отключаем кнопки после ответа
            allButtons.forEach(btn => btn.disabled = true);

            if (selectedTense === currentWord.tense) {
                result.textContent = "Верно!";
                button.classList.add("correct");
            } else {
                result.textContent = `Неправильно! Правильный ответ: ${currentWord.tense}`;
                button.classList.add("wrong");

                // Подсветка правильного ответа
                allButtons.forEach(btn => {
                    if (btn.textContent.includes(currentWord.tense.split(" ")[0])) {
                        btn.classList.add("correct");
                    }
                });
            }

            document.getElementById("next").style.display = "inline-block"; // Показ кнопки "Следующее слово"
        }

        nextWord();
    </script>
</body>
</html>
