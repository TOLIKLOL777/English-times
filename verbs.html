<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Tektur", sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }
        .title{
            margin-bottom: 20px;
            animation: fadeInUp 0.5s ease-in-out forwards;
        }
        .par{
            margin-bottom: 50px;
            animation: fadeInUp 0.5s ease-in-out forwards;
        }
        .back-button {
            display: flex;
            text-align: start;
            font-family: Tektur;
            padding: 10px 20px;
            margin: 5px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            background: linear-gradient(45deg, #ff6b6b, #ffb84d);
            color: white;
            border-radius: 8px;
            transition: 0.3s;
            margin-top: 10px;
            margin-bottom: 70px;
            margin-left: 20px;
        }
        .back-button:hover {
            background: linear-gradient(45deg, #ff4b4b, #ffa500);
            transform: scale(1.05);
        }
        .word {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            width: 200px;
        }
        .start {
            transform: scale(0.8);
            animation: fadeInScale 0.5s ease-in-out forwards;
        }
        .option-button {
            font-family: Tektur;
            padding: 12px 25px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: 0.3s;
            color: white;
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            position: relative;
            transform: translateY(-10px);
            animation: fadeInUp 0.5s ease-in-out forwards;
        }
        .option-button:not(:disabled):hover {
            background: linear-gradient(45deg, #3b82f6, #00c9ff);
        }
        .correct {
            background: linear-gradient(45deg, #4caf50, #81c784) !important;
        }
        .wrong {
            background: linear-gradient(45deg, #e53935, #ff6f61) !important;
        }
        .result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }
        .next {
            display: none;
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #ff6b6b, #ffb84d);
            color: white;
            transition: 0.3s;
        }
        .next:hover {
            background: linear-gradient(45deg, #ff4b4b, #ffa500);
            transform: scale(1.05);
        }
        .form {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .start_btn {
            font-family: Tektur;
            position: relative;
            width: 100px;
            padding: 12px 24px;
            margin-top: 100px;
            font-size: 24px;
            font-weight: bold;
            color: rgb(0, 0, 0);
            background: linear-gradient(45deg, #069219, #2abd05);
            border: none;
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
            transition: 0.3s ease-in-out;
            transition: transform 0.3s, background 0.3s;
        }  

        .start_btn:hover {
            background: linear-gradient(45deg, #066412, #27b803);
            transform: scale(1.1);
        }
 

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }

        .shake-text {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes zoomIn {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <button onmouseover="playSound()" class="back-button" onclick="window.location.href='menu.html';">Back</button>
    <button id="start_btn" class="start_btn">Play</button>
    <div id="form" class="form">
        <h1 class="title">Verb training in different forms</h1>
        <p class="par">Choose the tense to which the verb belongs:</p>
        <div class="word" id="word">...</div>
        <div>
            <button class="option-button" data-tense="present" onclick="checkAnswer('present', this)">Present Simple</button>
            <button class="option-button" data-tense="past" onclick="checkAnswer('past', this)">Past Simple</button>
            <button class="option-button" data-tense="future" onclick="checkAnswer('future', this)">Future Simple</button>
        </div>
        <p id="result" class="result"></p>
    </div>
    <button class="next" id="next" onclick="nextWord()">Next word</button>
    <audio id="start" src="sounds/Choose_cortence.mp3"></audio>
    <audio id="awesome" src="sounds/awesome.mp3"></audio>
    <audio id="good" src="sounds/good.mp3"></audio>
    <audio id="yaright" src="sounds/yaright.mp3"></audio>
    <audio id="correct" src="sounds/correct.mp3"></audio>
    <audio id="yanotright" src="sounds/yanotright.mp3"></audio>
    <audio id="tryagn" src="sounds/tryagn.mp3"></audio>
    <audio id="wrong" src="sounds/wrong.mp3"></audio>
    <audio id="hoverSound" src="sounds/btn_hover.mp3"></audio>
    <audio id="letbgn" src="sounds/letbeg.mp3"></audio>
    <audio id="letstart" src="sounds/letstart.mp3"></audio>
    <script>
         const words = [
            { word: "go", tense: "present" }, { word: "went", tense: "past" }, { word: "will go", tense: "future" },
            { word: "eat", tense: "present" }, { word: "ate", tense: "past" }, { word: "will eat", tense: "future" },
            { word: "see", tense: "present" }, { word: "saw", tense: "past" }, { word: "will see", tense: "future" },
            { word: "run", tense: "present" }, { word: "ran", tense: "past" }, { word: "will run", tense: "future" },
            { word: "write", tense: "present" }, { word: "wrote", tense: "past" }, { word: "will write", tense: "future" },
            { word: "speak", tense: "present" }, { word: "spoke", tense: "past" }, { word: "will speak", tense: "future" },
            { word: "drive", tense: "present" }, { word: "drove", tense: "past" }, { word: "will drive", tense: "future" },
            { word: "swim", tense: "present" }, { word: "swam", tense: "past" }, { word: "will swim", tense: "future" },
            { word: "jump", tense: "present" }, { word: "jumped", tense: "past" }, { word: "will jump", tense: "future" },
            { word: "think", tense: "present" }, { word: "thought", tense: "past" }, { word: "will think", tense: "future" },
            { word: "build", tense: "present" }, { word: "built", tense: "past" }, { word: "will build", tense: "future" },
            { word: "find", tense: "present" }, { word: "found", tense: "past" }, { word: "will find", tense: "future" },
            { word: "give", tense: "present" }, { word: "gave", tense: "past" }, { word: "will give", tense: "future" }
        ];

        const sounds_y = [
            'awesome', 'good', 'yaright', 'correct'
        ]

        const sounds_n = [
            'wrong', 'tryagn', 'yanotright'
        ]

        const sounds_let = [
            'letbgn', 'letstart'
        ]

        document.getElementById("start_btn").addEventListener("click", async function() {
            let text = document.getElementById("form");
            text.style.display = "flex";
            document.getElementById("start_btn").style.display = 'none';

            let audio1 = document.getElementById(sounds_let[Math.floor(Math.random()*sounds_let.length)]);
            let audio2 = document.getElementById('start');

            audio1.currentTime = 0;
            audio1.play();

            await new Promise(resolve => audio1.onended = resolve);
            audio2.currentTime = 0;
            audio2.play();
        });

        let currentWord = {};
        document.getElementById("word").classList.add("start");
        setTimeout(() => document.getElementById("word").classList.remove("start"), 500);

        function nextWord() {
            currentWord = words[Math.floor(Math.random() * words.length)];
            document.getElementById("word").textContent = currentWord.word;
            document.getElementById("result").textContent = "";
            document.getElementById("next").style.display = "none";
            
            document.querySelectorAll(".option-button").forEach(button => {
                button.disabled = false;
                button.classList.remove("correct", "wrong");
            });
        }

        function checkAnswer(selectedTense, button) {
            const result = document.getElementById("result");
            const allButtons = document.querySelectorAll(".option-button");

            allButtons.forEach(btn => btn.disabled = true);

            if (selectedTense === currentWord.tense) {
                let audio = document.getElementById(sounds_y[Math.floor(Math.random()*sounds_y.length)]);
                audio.currentTime = 0;
                audio.play();
                result.textContent = "Верно!";
                button.classList.add("correct");
            } else {
                let audio = document.getElementById(sounds_n[Math.floor(Math.random()*sounds_n.length)]);
                audio.currentTime = 0;
                audio.play();
                result.textContent = `Неправильно! Правильный ответ: ${currentWord.tense}`;
                button.classList.add("wrong");
                shakeTitle();

                allButtons.forEach(btn => {
                    if (btn.dataset.tense === currentWord.tense) {
                        btn.classList.add("correct");
                    }
                });
            }
            document.getElementById("next").style.display = "inline-block";
        }

        function shakeTitle() {
            const title = document.getElementById("word");
            title.classList.add("shake-text");
            setTimeout(() => title.classList.remove("shake-text"), 500);
        }
        nextWord();
        
        function playSound() {
            let audio = document.getElementById("hoverSound");
            audio.currentTime = 0;
            audio.play();
        }
    </script>
</body>
</html>
