<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>
    <style>
        .wave-button {
            position: relative;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: dodgerblue;
            border: none;
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
            transition: 0.3s ease-in-out;
            box-shadow: 0 4px 15px rgba(30, 144, 255, 0.4);
        }

        .wave-button::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.5s ease;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
        }

        .wave-button:active::before {
            transform: translate(-50%, -50%) scale(1);
            transition: 0s;
        }

        .wave-button:hover {
            background: #1e90ff;
            box-shadow: 0 6px 20px rgba(30, 144, 255, 0.6);
        }

        .wave-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <button class="wave-button">Нажми меня</button>
</body>
</html>
